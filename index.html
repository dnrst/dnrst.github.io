<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Personal Bloger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none';" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="visual-bg"></div>

  <main>
    <header class="profile">
      <img src="./images/bgprofile.jpg" alt="Profile Picture" class="avatar" />
      <h1>@deniristianto</h1>
    </header>

    <ul class="links">
      <li>
        <a href="https://dnrst.42web.io/" target="_blank" rel="noopener noreferrer">
          <span class="link-icon">
            <img src="images/officebg.png" alt="Personal Web" />
          </span>
          <span class="link-text">Personal Portfolio</span>
        </a>
      </li>
      <li>
        <a href="https://github.com/dnrst/" target="_blank" rel="noopener noreferrer">
          <span class="link-icon">
            <img src="images/gitbg.png" alt="GitHub" />
          </span>
          <span class="link-text">GitHub</span>
        </a>
      </li>
      <li>
        <a href="https://www.linkedin.com/in/deniristianto/" target="_blank" rel="noopener noreferrer">
          <span class="link-icon">
            <img src="images/linkedinbg.png" alt="LinkedIn" />
          </span>
          <span class="link-text">LinkedIn</span>
        </a>
      </li>
    </ul>
  </main>

  <script src="security.js"></script>
  <script src="app.js"></script>
</body>
</html>
